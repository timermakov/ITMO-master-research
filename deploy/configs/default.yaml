# Env var names for benchmark-bench manifest (protocol v2).
# Values only in .env.local.

bench:
  seed: DWSS_BENCH_SEED
  samples: DWSS_BENCH_SAMPLES
  runs: DWSS_BENCH_RUNS
  proxy_url: DWSS_BENCH_PROXY_URL
  warmup_url: DWSS_BENCH_WARMUP_URL
  active_url: DWSS_BENCH_ACTIVE_URL
  coord_url: DWSS_BENCH_COORD_URL
  rps: DWSS_BENCH_RPS
  load_duration_sec: DWSS_BENCH_LOAD_DURATION_SEC
  cv_threshold: DWSS_BENCH_CV_THRESHOLD
  cooldown_ms: DWSS_BENCH_COOLDOWN_MS
  target_instance: DWSS_BENCH_TARGET_INSTANCE
  active_instance: DWSS_BENCH_ACTIVE_INSTANCE
  ready_after: DWSS_BENCH_READY_AFTER
  h4_load_duration_sec: DWSS_BENCH_H4_LOAD_DURATION_SEC
